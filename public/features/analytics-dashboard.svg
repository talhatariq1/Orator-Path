<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#F5F5F5" rx="20" ry="20"/>
  
  <!-- Dashboard Header -->
  <rect x="40" y="40" width="320" height="60" rx="8" ry="8" fill="#3F51B5"/>
  <text x="60" y="75" font-family="Arial" font-size="16" fill="#FFFFFF">FOCUS ANALYTICS</text>
  <rect x="240" y="50" width="100" height="30" rx="15" ry="15" fill="#FFFFFF" opacity="0.2"/>
  <text x="250" y="70" font-family="Arial" font-size="12" fill="#FFFFFF">Show data: 30 days</text>
  
  <!-- Main Chart -->
  <rect x="40" y="120" width="320" height="160" rx="8" ry="8" fill="#FFFFFF"/>
  <text x="60" y="145" font-family="Arial" font-size="14" fill="#333333">Conciseness</text>
  <text x="250" y="145" font-family="Arial" font-size="14" fill="#333333">Filler Words</text>
  
  <!-- Conciseness Chart -->
  <path d="M60,220 L140,180 L220,240 L300,160" stroke="#3F51B5" stroke-width="3" fill="none"/>
  <circle cx="60" cy="220" r="5" fill="#3F51B5"/>
  <circle cx="140" cy="180" r="5" fill="#3F51B5"/>
  <circle cx="220" cy="240" r="5" fill="#3F51B5"/>
  <circle cx="300" cy="160" r="5" fill="#3F51B5"/>
  
  <!-- Stats Cards -->
  <rect x="40" y="300" width="320" height="60" rx="8" ry="8" fill="#FFFFFF"/>
  <circle cx="60" cy="330" r="10" fill="#3F51B5"/>
  <text x="80" y="335" font-family="Arial" font-size="14" fill="#333333">4% higher than the last 30 days</text>
  
  <!-- Progress Indicator -->
  <rect x="40" y="370" width="320" height="1" fill="#E0E0E0"/>
  <rect x="40" y="370" width="200" height="1" fill="#3F51B5"/>
</svg>